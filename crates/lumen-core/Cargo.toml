[package]
name = "lumen-core"
description = "Index, matching, ranking and theming for Lumen. Knows nothing about the operating system or about GPUI (AD-03, I-1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lumen-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
# preserve_order: the translate store edits config.json as a document, and a
# save must not re-sort a file people edit by hand. Already on in the full
# build through gpui, so it costs nothing there.
serde_json = { workspace = true, features = ["preserve_order"] }
log.workspace = true
nucleo-matcher.workspace = true
directories.workspace = true
notify.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1.13"
# Favicons for quicklinks (F6). All three are already in the build through
# gpui, so sharing their versions costs little; the client is the blocking
# half of the same reqwest, pinned exactly like gpui (I-6).
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp", "gif", "bmp"] }
resvg = "0.45"
# Dates of exchange-rate tables (F9). Already in the build through
# env_logger. Snippets (F11) need the user's time zone: `tz-system` reads it
# from the system, and `tzdb-bundle-platform` bundles the database where the
# system has none to read, which is Windows.
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false
