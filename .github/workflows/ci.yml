name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

  # I-2: `lumen-platform-linux` always compiles, even while its methods are
  # `todo!()`, and this runs on every commit.
  #
  # This is the invariant that keeps R-4 -- Windows assumptions leaking into the
  # core until porting becomes a rewrite -- detectable the same day rather than
  # in F5. In particular, changing `trait Platform` without updating both
  # implementations (I-9) fails here.
  linux-cross-check:
    name: Linux cross-check (I-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # GPUI's Linux backend links against the X11 and Wayland stacks, so the
      # cross-check needs them present even though nothing here opens a window.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libasound2-dev libfontconfig-dev pkg-config

      - name: Check the portable crates
        run: cargo check -p lumen-core -p lumen-platform -p lumen-platform-linux

      - name: Test the portable crates
        run: cargo test -p lumen-core -p lumen-platform

  benchmarks:
    name: Performance budgets (I-8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Runs the ranking benchmark so a change that makes search quadratic
      # cannot land unnoticed.
      #
      # Stated honestly: this measures and publishes, it does not yet fail the
      # build on a regression, and the gesture-to-first-frame and idle-footprint
      # budgets still need a harness that drives the real binary. Both gaps are
      # listed in the README rather than left implied.
      - name: Search benchmark
        run: cargo bench -p lumen-core --bench search -- --warm-up-time 1 --measurement-time 3
