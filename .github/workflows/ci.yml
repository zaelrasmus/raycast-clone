name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

  # I-2: `lumen-platform-linux` always compiles, even while its methods are
  # `todo!()`, and this runs on every commit.
  #
  # This is the invariant that keeps R-4 -- Windows assumptions leaking into the
  # core until porting becomes a rewrite -- detectable the same day rather than
  # in F5. In particular, changing `trait Platform` without updating both
  # implementations (I-9) fails here.
  linux-cross-check:
    name: Linux cross-check (I-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # GPUI's Linux backend links against the X11 and Wayland stacks, so the
      # cross-check needs them present even though nothing here opens a window.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libasound2-dev libfontconfig-dev pkg-config

      - name: Check the portable crates
        run: cargo check -p lumen-core -p lumen-platform -p lumen-platform-linux

      - name: Test the portable crates
        run: cargo test -p lumen-core -p lumen-platform

  # I-8: "The performance budgets are measured in CI. A regression breaks the
  # build." Two of the six can be enforced here and are. The other four --
  # gesture to first frame, idle CPU, idle memory, cold start -- need a
  # compositor presenting to a real display, a genuinely idle session and a GPU,
  # none of which a hosted runner has. The daemon measures those itself and the
  # README records them; see deviation 7.24 for why that gap is stated rather
  # than filled with numbers that only look like evidence.
  budgets:
    name: Performance budgets (I-8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fails the build if ranking stops being linear in the size of the index,
      # or blows past a very loose ceiling. Asserts a shape rather than a
      # stopwatch reading, because a shared runner's clock speed is not
      # something to assert against -- the reasoning is in the test file.
      - name: Ranking budget
        run: cargo test -p lumen-core --test budgets --release

      - name: Build for size
        run: cargo build --release --bin lumen

      # Installed size (< 40 MB). Bytes, so there is nothing to be noisy about.
      # The binary is the whole install: the font, the icons, the themes and the
      # example script are all compiled in, and the config folder is written on
      # first run rather than shipped.
      - name: Installed size budget
        shell: pwsh
        run: |
          $budget = 40MB
          $size = (Get-Item target/release/lumen.exe).Length
          "lumen.exe is {0:N1} MB (budget: {1:N0} MB)" -f ($size / 1MB), ($budget / 1MB)
          if ($size -gt $budget) {
            throw "installed size is over budget by $([math]::Round(($size - $budget) / 1MB, 1)) MB"
          }

      # Published for the record rather than asserted on: the real figures
      # belong next to a machine they were taken on, and the README says which.
      - name: Search benchmark
        run: cargo bench -p lumen-core --bench search -- --warm-up-time 1 --measurement-time 3
